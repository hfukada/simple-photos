<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}Photos{{end}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Photos</a>
  {{with .User}}
  <div class="who">
    <span>{{.Email}}</span>
    <form method="post" action="/logout"><button class="link">Sign out</button></form>
  </div>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
